name: copilot
config:
  paths:
    windows: "%USERPROFILE%\\.copilot"
    darwin: "~/.copilot"
    linux: "~/.copilot"
  include:
    - "config.json"
  sessions:
    - "history/**/*.json"
  exclude:
    - "**/*token*"
    - "**/hosts.json"
secrets:
  key_patterns: ["apiKey", "token", "secret", "password", "oauth", "refresh_token"]
