name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --version=3.11 --yes --no-progress
          }
          npm ci --prefix frontend
      - name: Test Windows packaging rules
        shell: pwsh
        run: ./scripts/release/test-windows.ps1
      - name: Build, optionally sign, and package Windows x64
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGN_THUMBPRINT: ${{ vars.WINDOWS_SIGN_THUMBPRINT }}
          WINDOWS_TIMESTAMP_SERVER: ${{ vars.WINDOWS_TIMESTAMP_SERVER }}
          WINDOWS_REQUIRE_SIGNING: ${{ vars.WINDOWS_REQUIRE_SIGNING }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/release/windows.ps1 -Version $env:RELEASE_TAG
          Get-Content bin\WINDOWS-RELEASE-NOTES.txt | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Test updater and desktop integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go test . ./internal/updater ./internal/desktop ./internal/scheduler ./internal/daemon
          npm --prefix frontend test -- --run src/UpdatePanel.test.tsx src/SettingsPanel.test.tsx src/App.test.tsx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows
          path: |
            bin/SyncHub-for-Agents-Setup-x64.exe
            bin/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-notes
          path: bin/WINDOWS-RELEASE-NOTES.txt
          if-no-files-found: error

  macos:
    # Opt in only after configuring the existing Developer ID/notarization secrets.
    if: vars.RELEASE_MACOS == 'true'
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
          npm ci --prefix frontend
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          keychain="$RUNNER_TEMP/release.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p runner "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p runner "$keychain"
          security import "$RUNNER_TEMP/codesign.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$keychain"
      - name: Build, sign, notarize, and package
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
        run: |
          test -n "$SIGNING_IDENTITY"
          wails3 task darwin:package:universal VERSION="${GITHUB_REF_NAME#v}" GITHUB_OAUTH_CLIENT_ID="$OAUTH_CLIENT_ID"
          codesign --force --deep --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "$SIGNING_IDENTITY" bin/SyncHub.app
          codesign --verify --deep --strict --verbose=2 bin/SyncHub.app
          wails3 task darwin:create:dmg
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" bin/SyncHub.dmg
          xcrun notarytool submit bin/SyncHub.dmg --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple bin/SyncHub.dmg
          xcrun stapler validate bin/SyncHub.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-macos
          path: bin/SyncHub.dmg
          if-no-files-found: error

  linux:
    if: vars.RELEASE_LINUX == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libgtk-4-dev libwebkitgtk-6.0-dev libfuse2
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          npm ci --prefix frontend
      - name: Package
        env:
          OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          wails3 package GOOS=linux ARCH=amd64 VERSION="$version" GITHUB_OAUTH_CLIENT_ID="$OAUTH_CLIENT_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-linux
          path: |
            bin/*.AppImage
            bin/*.deb
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    if: >-
      always() && !cancelled() &&
      needs.windows.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-release-notes
          path: release-notes
      - name: Create checksums
        working-directory: dist
        run: |
          test -s SyncHub-for-Agents-Setup-x64.exe
          sha256sum --check SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' |
            sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(--verify-tag --generate-notes --notes-file release-notes/WINDOWS-RELEASE-NOTES.txt)
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
