name: Self-healing diagnostics

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: self-healing-diagnostics-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  response:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    name: CI failure response
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify review-only rollback path
        id: rollback
        run: node scripts/dev.mjs rollback:verify
      - name: Prepare bounded repair and rollback handoff
        id: proposal
        run: node scripts/dev.mjs propose
      - name: Publish rollback verification
        if: always() && steps.rollback.outputs.report_directory != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rollback-verification
          path: ${{ steps.rollback.outputs.report_directory }}
          retention-days: 14
          if-no-files-found: error
      - name: Publish CI failure response
        if: always() && steps.proposal.outputs.report_directory != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-failure-response
          path: ${{ steps.proposal.outputs.report_directory }}
          retention-days: 14
          if-no-files-found: error
